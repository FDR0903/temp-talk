<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 105" role="img" aria-labelledby="title description">
  <title id="title">Timing of the two-round market</title>
  <desc id="description">At date one, traders choose AI and human analysis, observe a signal and trade. At date two, they receive the first payoff, update cognitive capital, choose inputs again, observe a signal and trade. At date three, they receive the second payoff and consume final wealth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#b7becb" stroke-width="1.5" />
    </marker>
  </defs>
  <path d="M 18 35 H 887" fill="none" stroke="#cbd0dc" stroke-width="1.5" marker-end="url(#arrow)" />
  <g fill="#3333b3">
    <circle cx="18" cy="35" r="3.5" />
    <circle cx="342" cy="35" r="3.5" />
    <circle cx="729" cy="35" r="3.5" />
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#3333b3">
    <text x="18" y="20">Round 1 · t = 1</text>
    <text x="342" y="20">Round 2 · t = 2</text>
    <text x="729" y="20">t = 3</text>
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-size="14.5" fill="#596273">
    <text x="18" y="61">Choose AI + human analysis</text>
    <text x="18" y="83">Observe signal → trade</text>
    <text x="342" y="61">Receive first payoff · update capital</text>
    <text x="342" y="83">Choose inputs → signal → trade</text>
    <text x="729" y="61">Receive second payoff</text>
    <text x="729" y="83">Final wealth</text>
  </g>
</svg>
